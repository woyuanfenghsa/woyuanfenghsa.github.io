<!DOCTYPE html>
<html lang="zh-CN" data-theme="astral">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人主页 · 星辰、火焰与极昼</title>
  <meta name="description" content="个人学术与技术主页：简历、论文发表与长文随笔。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Live Interactive Canvas: Stars (星辰) + Embers (火焰) + Polar Horizon (极昼) -->
  <canvas id="cosmos-canvas" class="cosmos-canvas" aria-hidden="true"></canvas>

  <!-- Atmospheric Polar Day Horizon & Aurora Ambient Glow Layers -->
  <div class="atmosphere" aria-hidden="true">
    <div class="polar-sun-halo"></div>
    <div class="polar-aurora"></div>
    <div class="ember-horizon"></div>
  </div>

  <!-- Reading Progress Beam -->
  <div id="reading-progress" class="reading-progress" aria-hidden="true"></div>

  <!-- Astral Glass Top Navigation -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="#home" class="brand" data-route="home">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span class="brand-text" id="brand-name">个人主页</span>
      </a>

      <nav class="main-nav" id="main-nav" aria-label="主导航">
        <a href="#home" class="nav-link" data-route="home">首页</a>
        <a href="#daily" class="nav-link" data-route="daily">每日论文</a>
        <a href="#papers" class="nav-link" data-route="papers">论文收集</a>
        <a href="#cv" class="nav-link" data-route="cv">个人简历</a>
        <a href="#blog" class="nav-link" data-route="blog">个人博客</a>
      </nav>

      <div class="header-actions">
        <button
          id="theme-toggle"
          class="mode-pill-btn"
          type="button"
          aria-label="切换星辰炽焰 / 极昼天穹主题"
          title="切换星夜与极昼模式"
        >
          <span class="mode-label-astral">☀ 极昼模式</span>
          <span class="mode-label-polar">✦ 星焰模式</span>
        </button>
        <button
          id="mobile-menu-toggle"
          class="icon-btn mobile-only"
          type="button"
          aria-label="展开菜单"
          aria-expanded="false"
        >
          <span aria-hidden="true">☰</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Dynamic View Container -->
  <main id="app" class="site-main" tabindex="-1"></main>

  <!-- Celestial Footer -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-col">
        <p class="footer-title" id="footer-brand">个人主页</p>
        <p class="footer-note" id="footer-note">向星辰发问，以炽焰求索，在极昼的光晕里持续写作。</p>
      </div>
      <div class="footer-links" id="footer-links"></div>
    </div>
    <div class="container footer-bottom">
      <span id="footer-copyright">© 2026</span>
      <span>STARS · FLAME · POLAR DAY · GitHub Pages</span>
    </div>
  </footer>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Data & App Scripts -->
  <script src="site-data.js"></script>
  <script src="daily-papers.js"></script>
  <script src="papers-data.js"></script>
  <script src="posts.js"></script>
  <script src="markdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
