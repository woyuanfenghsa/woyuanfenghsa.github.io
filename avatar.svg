    <path d="M72 64 C52 52, 24 52, 6 60 L6 12 C24 4, 52 4, 72 18 Z" fill="#FFFDF9" opacity="0.94"/>
    <path d="M72 64 C92 52, 120 52, 138 60 L138 12 C120 4, 92 4, 72 18 Z" fill="#FAF7F2" opacity="0.94"/>
