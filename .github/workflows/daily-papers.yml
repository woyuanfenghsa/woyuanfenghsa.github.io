name: Daily arXiv Paper Radar

on:
  schedule:
    # Run every day at 00:30 UTC (08:30 Beijing Time)
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-daily-papers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and score daily arXiv papers
        run: python3 fetch_daily_papers.py

      - name: Commit and push updated daily-papers.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet daily-papers.js; then
            echo "No new paper updates today."
            exit 0
          fi
          TODAY=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          git add daily-papers.js
          git commit -m "chore: update daily arXiv papers (${TODAY})"
          git push
